name: 01 - Building Blocks
on: [workflow_dispatch]

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello, World!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Fail to Pass step
        run: |
          echo "This step"
          echo "will now pass"
          exit 0
      - name: Say goodbye
        run: echo "Goodbye!"