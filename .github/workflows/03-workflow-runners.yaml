name: "03 - Workflow Runners"
on:
  push:
    branches: [ CW03 ]
  workflow_dispatch:

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a Ubuntu runner" 
          echo ${{ runner.os }}
  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a Windows runner" 
          echo ${{ runner.os }}
  mac-echo:
    runs-on: macos-latest
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a Mac runner" 
          echo ${{ runner.os }}
  self-echo:
    runs-on: self-hosted
    steps:
      - name: Show OS
        run: |
          echo "This job is running on a self-hosted runner" 
          echo ${{ runner.os }}