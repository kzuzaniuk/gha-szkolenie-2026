name: "04 - Using Actions: Docker actions"
on:
  workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: self-hosted
    defaults:
        run:
            working-directory: CWICZENIA/04-praca-z-zewnetrznymi-akcjami/docker-app-02
    env:
        IMAGE_TAG: "webapp"
        TAG: ${{github.sha}}
        HOST-PORT: 18080
        CONTAINER_PORT: 80
    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v3
        - name: Build and Push Docker Image
          uses: docker/build-push-action@v5
          with:
            context: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrznymi-akcjami/docker-app-02
            push: false
            load: true
            tags: ${{ env.IMAGE_TAG }}:${{ env.TAG }}

        - name: Compose up #uruchomienie kontenerów z docker-compose.yaml
          uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433
          with:
            compose-file: docker-compose.yaml
            project-name: docker-app2
            downflags: --volumes --remove-orphans
            action: up
            options: -d
        
        - name: Health Check #czekaj aż kontener wystartuje i będzie dostępny na porcie 8080
          uses: jtalk/url-health-check-action@v5
          with:
            url: http://localhost:${{ env.HOST-PORT }}/
            max-attemps: 30
            retry-delay: 1s
            follow-redirects: false

        - name: GET /** #pobierz stronę główną z kontenera i pokaż w logach
          uses: satak/webrequest-action@master
          with: 
            url: http://localhost:${{ env.HOST-PORT }}/
            method: GET

        - name: Assert page contains text
          uses: actions/github-script@v7
          with:
            script: |
                const body = `${{ steps.page.outputs.output}}`;
                if (!body.includes("c204 github actions")) {
                    core.setFailed("Page does not contain expected text");
                }
        # Pobierz obrazek
        - name: GET /assets/wall.jpg
          id: img
          uses: fjogeleit/http-request-action@v1
          with:
            url: http://localhost:${{ env.HOST_PORT }}/assets/wall.jpg
            method: GET
            timeout: 30000

        # Asercja: status 200 oraz prosty check nagłówków
        - name: Assert image 200
          uses: actions/github-script@v7
          with:
            script: |
                const status = Number(`${{ steps.img.outputs.status }}`);
                if (status !== 200) {
                core.setFailed(`Obrazek nie jest dostępny (HTTP ${status}).`);
                }
                const headers = `${{ steps.img.outputs.headers }}`.toLowerCase();
                if (!headers.includes('image') && !headers.includes('jpeg') && !headers.includes('jpg')) {
                core.warning('Content-Type nie wygląda na obrazek JPEG.');
                }

        # Logi kontenera (zawsze) - bez 'run', przez github-script (node child_process)
        - name: Docker logs (always)
          if: always()
          uses: actions/github-script@v7
          with:
            script: |
                const { execSync } = require('node:child_process');
                try {
                const out = execSync('docker logs webapp', { encoding: 'utf8' });
                core.info('---- docker logs webapp ----\n' + out + '\n-----------------------------');
                } catch (e) {
                core.warning('Nie udało się pobrać logów kontenera: ' + e.message);
                }

        # Sprzątanie: compose down (zawsze)
        - name: Compose down (always)
          if: always()
          uses: isbang/compose-action@v2
          with:
            compose-file: ${{ github.workspace }}/CWICZENIA/04-praca-z-zewnetrzymi-akcjami/docker-app-02/docker-compose.yml
            commands: down --volumes --remove-orphans