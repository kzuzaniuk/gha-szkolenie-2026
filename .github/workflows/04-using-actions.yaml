name: "04 - Using Actions"

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: ./04-using-actions #ustawia katalog roboczy dla wszystkich kroków w tym jobie, żeby nie trzeba było powtarzać w każdym kroku
    name: Build and Test React App
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Printing Folders
        run: |
          echo "Printing folders in the repository:"
          ls -la
          pwd