name: "04 - Using Actions"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: ./CWICZENIA/04-praca-z-zewnetrznymi-akcjami/react-app #ustawia katalog roboczy dla wszystkich kroków w tym jobie, żeby nie trzeba było powtarzać w każdym kroku
    name: Build and Test React App
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Printing Folders
        run: |
          echo "Printing folders in the repository:"
          ls -la
          pwd
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        run: npm run test -- --watchAll=false