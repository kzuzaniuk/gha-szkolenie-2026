name: "09 - Using functions"
on:
    pull_request:
    workflow_dispatch:

jobs:
    echo1:
        runs-on: ubuntu-latest
        steps:
            - name: Failing step
              run: exit 1
            - name: I will be skipped
              if: success()
              run: echo "I will print if previous steps succeed"
            - name: I will execute
              if: failure()
              run: echo "I will print if any previous step fails."
            - name: I will execute
              if: always()
              run: echo "I will always print. except when cancelled"
            - name: I will execute when cancelled
              if: cancelled()
              run: echo "Something got cancelled"