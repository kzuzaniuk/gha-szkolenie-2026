name: "13 - Caching Docker"

on:
    push:
        branches:
            - cw13
    pull_request:
    workflow_dispatch:

defaults:
    run:
        shell: bash
        working-directory: ./CWICZENIA/13-caching/docker01

env:
    WORKDIR: ./CWICZENIA/13-caching/docker01

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build Docker image (with cache)
              uses: docker/build-push-action@v6
              with:
                context: ${{env.WORKDIR}}/Dockerfile
                load: true
                push: false
                tags: test-nginx:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max