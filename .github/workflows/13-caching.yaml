name: "13 - Caching Docker"

on:
    push:
        branches:
            - cw13
    pull_request:
    workflow_dispatch:

defaults:
    run:
        shell: bash
        working-directory: ./CWICZENIA/13-caching/docker01

env:
    WORKDIR: CWICZENIA/13-caching/docker01
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Cache Docker Layers
              uses: actions/cache@v3
              with:
                path: /tmp/.buildx-cache
                key: ${{runner.os}}-buildx-${{ hashFiles('**/Dockerfile')}}
                restore-keys: |
                    ${{runner.os}}-buildx  
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build Docker image (with cache)
              uses: docker/build-push-action@v6
              with:
                context: ${{github.workspace}}/${{env.WORKDIR}}
                file: ./Dockerfile
                load: true
                push: false
                tags: test-nginx:latest
                cache-from: type=local,src=/tmp/.buildx-cache #type=gha
                cache-to: type=local,dest=/tmp/.buildx-cache,new=true #type=gha,mode=max