name: "15A FAZA-1 - Pogoda WWW i API"

on:
    workflow_dispatch:
    push:
        branches:
            - main
defaults:
    run:
        shell: bash

env:
    APP_DIR: CWICZENIA/15A-Cwiczenia-pipeline-gha/pogoda_python_flusk
    HUB_IMAGE_BASE: ${{secrets.DOCKER_USERNAME}}/${{vars.DOCKER_IMAGE_NAME}}
    CI_IMAGE: ci-${{github.sha}}
    IMAGE_TAG: ${{vars.FAZA1_IMAGE_TAG}}
    APP_PORT: ${{vars.FAZA1_APP_PORT}}
    CONTAINER_NAME: ${{vars.FAZA1_CONTAINER_NAME}}
    WEATHER_CITY: ${{vars.FAZA1_WEATHER_CITY}}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build and push (optionally)
              uses: docker/build-push-action@v6
              with:
                context: ./${{env.APP_DIR}}
                tags: ${{env.CI_IMAGE}}
                load: true
                push: false
            - name: Save image
              run: |
                docker save "$CI_IMAGE" -o image.tar
            - name: Upload image
              uses: actions/upload-artifact@v4
              with:
                name: faza1-weather-image
                path: image.tar
    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Get artifcat
              uses: actions/download-artifact@v4
              with:
                name: faza1-weather-image
            - name: Load image
              run: |
                docker load -i image.tar
            - name: Run contener
              env:
                OPENWEATHER_API_KEY: ${{secrets.MY_KLUCZYK}}
              run: |
                if [ -z "$OPENWEATHER_API_KEY"]; then
                 echo "::error::Brak respository secret API KEY"
                 exit 1
                fi
                docker run -d \
                --name "$CI_IMAGE" \
                -p 127.0.0.1:"$APP_PORT":8080
                -e OPENWEATHER_API_KEY \
                "${HUB_IMAGE_BASE}:${CI_TAG}"
                curl -f -s -S \
                    --connect-timeout 2 \
                    --max-time 5 \
                    --retry 10 \
                    --retry-delay 2 \
                    --retry-max-time 30 \
                    --retry-all-errors \
                    http://127.0.0.1:18090/healthz
            - name: Run test
              run: |
                python3 "${APP_DIR}/tests/smoke_test.py" \
                    --base-url http://127.0.0.1:18090 \
                    --city "$WEATHER_CITY"
                